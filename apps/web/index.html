<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapisko Academy · Weekly Phonics Pathway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital@0;1&family=Zilla+Slab:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/layout.css" />
  </head>
  <body>
    <aside class="side" id="side" aria-label="Learner profiles">
      <div class="side-brand">
        <img
          class="brand-emblem"
          src="assets/images/logo/logo_emblem_only_original.png"
          alt="Kapisko Academy emblem"
        />
        <span class="brand-name">Kapisko Academy</span>
      </div>

      <div class="side-teacher teacher-only">
        <button
          class="side-link"
          id="exitTeacherBtn"
          data-icon="chev-l"
        >
          Back to learner view
        </button>
        <button class="side-link" id="settingsBtn" data-icon="gear">
          Settings
        </button>
        <button class="side-link" id="reportsBtn" data-icon="chart">
          Progress reports
        </button>
      </div>

      <kal-profile-list class="side-section teacher-only"></kal-profile-list>

      <figure class="side-verse student-only" aria-label="Scripture of the day">
        <blockquote>Your word is a lamp for my feet and a light for my path.</blockquote>
        <figcaption>Psalm 119:105</figcaption>
      </figure>

      <div class="side-foot">
        <button
          class="side-link student-only"
          id="teacherBtn"
          data-icon="teacher"
        >
          Teacher’s dashboard
        </button>
        <div class="side-version">Kapisko · Term 1 · v2.4</div>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button
          class="icon-btn menu-btn"
          id="menuBtn"
          data-icon="menu"
          aria-label="Open learner menu"
        ></button>
        <nav class="crumb" aria-label="Breadcrumb">
          <a href="#">Home</a><span aria-hidden="true">/</span>
          <a href="#">Phonics</a><span aria-hidden="true">/</span>
          <span>Weekly Pathway</span>
        </nav>
        <div class="top-right">
          <label class="field search">
            <span class="f-icon" data-icon="search"></span>
            <input
              id="search"
              type="search"
              placeholder="Search lessons or sounds…"
              autocomplete="off"
              aria-label="Search lessons or sounds"
            />
          </label>
          <button
            class="icon-btn"
            id="bellBtn"
            data-icon="bell"
            aria-label="Notifications"
          >
            <span class="dot"></span>
          </button>
          <kal-top-avatar
            class="avatar avatar-top"
            id="topAvatar"
            aria-label="Switch learner"
          ></kal-top-avatar>
        </div>
      </header>

      <div class="page">
        <kal-strip class="strip" aria-label="Learner profiles"></kal-strip>
      </div>

      <footer class="foot">
        Made with care · Kapisko Academy (Not-for-profit) · Open source
        curriculum
      </footer>

      <kal-onboarding></kal-onboarding>
    </main>

    <kal-card-box></kal-card-box>
    <kal-guardian></kal-guardian>
    <kal-snackbar class="snack" role="status" aria-live="polite"></kal-snackbar>

    <script>
      // Static-first PWA (ADR-0007): the app is served over HTTP so its
      // ES modules and fetch() work. If opened straight from disk the
      // browser blocks both, leaving only the static shell — catch that
      // here and say so instead of looking broken.
      if (window.location.protocol === "file:") {
        var el = document.createElement("div");
        el.className = "served-over-http";
        el.setAttribute("role", "alert");
        el.innerHTML =
          "<b>Kapisko Academy needs a local server.</b>" +
          "<span>ES modules are blocked over <code>file://</code>. Run <code>python3 -m http.server</code> " +
          "from <code>apps/web/</code> and open <code>http://localhost:8000</code>.</span>";
        document.body.appendChild(el);
        document.body.classList.add("file-open");
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
